# Sample experiment matrix for AeroSentry YOLOv11 training (Jetson / discrete GPU laptop).
# Run:  PYTHONPATH=. python3 -m src.models.train_detector --config config/experiments.yaml --experiment A
# CPU-only fallback: device: cpu, imgsz: 512, batch: 4–6, cache: true (see train_detector auto-fallback if no CUDA).
#
# 4 GB GPUs (e.g. GTX 1650): defaults below use batch 8 + cache to avoid OOM retries and cut dataloader cost.
# To go faster (slightly lower quality): set imgsz: 512. For quick tests: lower epochs (e.g. 10–15).
# Ultralytics may disable AMP on some Turing cards — training stays correct but slower than FP16 on newer GPUs.

global:
  seed: 42
  # YOLO data yaml (see config/dataset_aerosentry.yaml for the bundled Roboflow export).
  data: config/dataset_aerosentry.yaml
  model: yolo11n.pt
  train:
    epochs: 150
    # 640 = best fidelity; use 512 on 4 GB cards if you need shorter epochs.
    imgsz: 640
    # 8 is safer on 4 GB VRAM (batch 16 often OOMs — Ultralytics then retries and rebuilds loaders = wasted time).
    batch: 8
    workers: 8
    # Pre-resize/cache train images once — speeds up later epochs (uses disk; ensure enough free space).
    cache: true
    # First CUDA device; use cpu only if PyTorch is +cpu or no NVIDIA driver.
    device: 0
    patience: 30
    save: true
    plots: true
    val: true
    # Project name only — Ultralytics already saves under runs/detect/ (avoid runs/detect/runs/...).
    project: aerosentry
    name: yolo11_baseline

experiments:
  # A — Baseline: standard nano training (no custom albumentations block in code path).
  A:
    notes: "Baseline YOLO11-n; Ultralytics-style defaults (mosaic 1, cls 0.5) — weaker mosaic / very high cls hurt the last A run."
    train:
      lr0: 0.01
      lrf: 0.01
      mosaic: 1.0
      mixup: 0.0
      box: 7.5
      cls: 0.5
      dfl: 1.5

  # B — Domain-specific augmentations: interceptor camera stress via Ultralytics Albumentations hook.
  B:
    notes: "Uses InterceptorAlbumentationsTrainer; blur/exposure/noise stack comes from train_detector.py."
    train:
      mosaic: 0.85
      mixup: 0.05
      copy_paste: 0.0
      close_mosaic: 15
      box: 7.5
      cls: 0.5
      dfl: 1.5
      name: yolo11_domain_aug
